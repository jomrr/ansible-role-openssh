---
# role: openssh
# file: molecule/resources/playbooks/prepare.yml

- name: OPENSSH | Prepare functional SSH fixtures
  hosts: all
  gather_facts: true
  tasks:
    - name: OPENSSH | Clear the container boot login restriction
      become: true
      become_user: root
      ansible.builtin.file:
        path: /run/nologin
        state: absent

    - name: OPENSSH | Refresh Debian package metadata
      become: true
      become_user: root
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts.pkg_mgr == 'apt'

    - name: OPENSSH | Create the controller key directory
      ansible.builtin.file:
        path: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/keys"
        state: directory
        mode: '0700'
      delegate_to: localhost
      run_once: true

    - name: OPENSSH | Generate an ephemeral client identity
      community.crypto.openssh_keypair:
        path: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/keys/client"
        type: ecdsa
        size: 384
        mode: '0600'
      delegate_to: localhost
      run_once: true

    - name: OPENSSH | Create a functional test account
      become: true
      become_user: root
      ansible.builtin.user:
        name: openssh-test
        password: '*'
        shell: /bin/sh
        create_home: true

    - name: OPENSSH | Copy the ephemeral client identity
      become: true
      become_user: root
      ansible.builtin.copy:
        src: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/keys/client"
        dest: /tmp/openssh-molecule-key
        owner: root
        group: root
        mode: '0600'
      no_log: true
